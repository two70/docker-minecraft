services:
  mc:
    image: itzg/minecraft-server
    ports:
    # expose the Minecraft server port outside of container
    - "${SERVER_PORT}:25565"
    - "${VOICE_PORT}:24454/udp"
    environment:
      TZ: ${TZ}
      # REQUIRED for all types
      EULA: ${EULA}
      # Server type: AUTO_CURSEFORGE installs a CurseForge modpack (mods + loader)
      TYPE: ${TYPE}
      # Used when TYPE is not AUTO_CURSEFORGE (the modpack sets these otherwise)
      VERSION: ${VERSION:-LATEST}
      NEOFORGE_VERSION: ${NEOFORGE_VERSION:-LATEST}
      # CurseForge modpack (TYPE=AUTO_CURSEFORGE)
      CF_API_KEY: ${CF_API_KEY:-}
      CF_SLUG: ${CF_SLUG:-}
      CF_FILE_ID: ${CF_FILE_ID:-}
      # Extra CurseForge mods on top of the pack: slug or slug:fileId, comma-separated
      CURSEFORGE_FILES: ${CURSEFORGE_FILES:-}
      MEMORY: ${MEMORY}
      MAX_MEMORY: ${MAX_MEMORY}
      DEBUG: ${DEBUG}
      MAX_PLAYERS: ${MAX_PLAYERS}
      PVP: ${PVP}
      MOTD: ${MOTD}
      GAMEMODE: ${GAMEMODE}
      DIFFICULTY: ${DIFFICULTY}
      OPS: ${OPS}
      WHITELIST: ${WHITELIST}
    volumes:
    # named, managed volume for server data
    - data:/data
    # attach local host directory "mods" in same directory as this compose file
    # all mods in this directory get copied into /data/mods at startup
    #- ./mods:/mods:ro
    restart: always

volumes:
  data:
